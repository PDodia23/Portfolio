<!-- Pooja Dodia portfolio · Settings → Advanced → Code Injection → HEADER -->
<script>(function(){try{var t=localStorage.getItem('pd-theme');if(t==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Geist:wght@300;400;500;700&family=Geist+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* hide Squarespace's own header/footer and the padding around the code block */
#header,header#header,.header,#footer-sections,footer.sections{display:none!important}
.page-section:has(.pd-site){padding:0!important;min-height:0!important}
.page-section:has(.pd-site) .content-wrapper{padding:0!important;max-width:none!important}
.page-section:has(.pd-site) .content{width:100%!important}
.page-section:has(.pd-site) .fluid-engine{display:block!important}
.page-section:has(.pd-site) .fe-block{all:unset;display:block}
.sqs-block:has(.pd-site),.sqs-block-content:has(.pd-site),.sqs-block-code:has(.pd-site){padding:0!important;margin:0!important}
.page-section:has(.pd-site) .section-background{background:var(--bg)!important}

:root{--bg:#000;--surface:#111112;--raised:#1c1c1e;--line:#4d4d4d;--text:#fff;--muted:#b3b3b3;--accent:#d9c4e8;--ink:#000;--chip:#1c1c1e;--prompt:#f2b862;--faint:#6b6b6b;
 --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Instrument Serif",Georgia,serif;
 --gut:clamp(16px,5.03vw,80px);--k:1;--kx:1;color-scheme:dark}
html[data-theme="light"]{--bg:#fff;--surface:#f9f6fc;--raised:#f3eef8;--line:#e6ddef;--text:#000;--muted:#4a4a4a;--accent:#000;--ink:#fff;--chip:#f5f0fa;--prompt:#a35f00;--faint:#404040;color-scheme:light}
@media (max-width:1100px){:root{--k:.75;--kx:.6}}
@media (max-width:700px){:root{--k:.55;--kx:.35}}
html,body{background:var(--bg)}
.pd-site{background:var(--bg);color:var(--text);font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased;overflow-x:clip;min-height:100vh}
.pd-site *,.pd-site *::before,.pd-site *::after{box-sizing:border-box}
.pd-site :where(h1,h2,h3,p,figure,ul,ol,fieldset,legend){margin:0;padding:0}
.pd-site :where(ul,ol){list-style:none}
.pd-site a{color:inherit;text-decoration:none}
.pd-site em{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.01em}
.pd-site .t{overflow-wrap:break-word;min-width:0}
.pd-site .t a{text-decoration:underline;text-underline-offset:3px}
.pd-site .f{min-width:0}
.pd-site .fig{display:block;overflow:hidden;min-width:0}
.pd-site .im{display:block;width:100%;height:auto}
.pd-site .fig .im{height:100%;object-fit:cover}
.pd-site .only-light{display:none}
html[data-theme="light"] .pd-site .adapt{color:var(--lc)!important}
html[data-theme="light"] .pd-site .only-light{display:block}
html[data-theme="light"] .pd-site .only-dark{display:none}
.pd-site .blk{display:flex;color:inherit;transition:opacity .2s,transform .2s}
.pd-site a.blk:hover{opacity:.92}
.pd-site a.blk:hover .fig .im{transform:scale(1.015)}
.pd-site .fig .im{transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.pd-site :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.pd-vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pd-skip{position:absolute;left:16px;top:-60px;z-index:100;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font:500 14px var(--sans)}
.pd-skip:focus{top:16px}
/* pills + chips */
.pd-site .pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:12px 22px;border-radius:999px;border:1px solid var(--text);background:transparent;color:var(--text);font:700 11px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
.pd-site .pill:hover{background:var(--text);color:var(--bg)}
.pd-site .pill--primary{background:var(--text);color:var(--bg)}
.pd-site .pill--primary:hover{background:var(--accent);border-color:var(--accent);color:var(--ink)}
html[data-theme="light"] .pd-site .pill--primary:hover{background:#333;border-color:#333;color:#fff}
.pd-site .pill--soft{background:var(--chip);border-color:transparent;text-transform:none;letter-spacing:0;font:400 14px var(--sans)}
.pd-site .pill--lg{font:500 16px var(--sans);letter-spacing:0;text-transform:none;padding:16px 28px}
.pd-site .chip{display:inline-flex;align-items:center;padding:7px 14px;border-radius:999px;background:var(--raised);color:var(--text);font:400 13px/1.3 var(--sans);max-width:100%;white-space:normal}
.pd-site .chip--filter{border:0;cursor:pointer;min-height:40px;padding:10px 18px;font-size:14px;background:var(--chip)}
.pd-site .chip--filter[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.pd-site .fcard[hidden]{display:none!important}
/* nav */
.pd-nav{position:relative;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:40px var(--gut) 40px 40px;color:var(--text)}
.pd-nav--over{position:absolute;top:0;left:0;right:0;color:#fff}
.pd-logo{display:inline-flex;flex:0 0 auto}
.pd-logo svg{height:40px;width:auto}
.pd-links ul{display:flex;gap:14px;align-items:center}
.pd-links a{font:700 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;padding:14px 0;display:inline-block}
.pd-main li:not(:last-child)::after{content:" .";font:700 11px/1 var(--sans);letter-spacing:.08em;white-space:pre}
.pd-main li{display:flex;align-items:center}
.pd-links a[aria-current="page"]{color:var(--accent)}
.pd-nav--over .pd-links a[aria-current="page"]{color:inherit}
.pd-links a:hover{opacity:.7}

.pd-menu{display:none;background:none;border:0;color:inherit;width:44px;height:44px;cursor:pointer;padding:0}
.pd-menu__bars,.pd-menu__bars::before,.pd-menu__bars::after{display:block;width:24px;height:2px;background:currentColor;border-radius:2px;margin:0 auto;position:relative;transition:transform .2s}
.pd-menu__bars::before,.pd-menu__bars::after{content:"";position:absolute;left:0}
.pd-menu__bars::before{top:-7px}.pd-menu__bars::after{top:7px}
.pd-menu[aria-expanded="true"] .pd-menu__bars{background:transparent}
.pd-menu[aria-expanded="true"] .pd-menu__bars::before{transform:translateY(7px) rotate(45deg)}
.pd-menu[aria-expanded="true"] .pd-menu__bars::after{transform:translateY(-7px) rotate(-45deg)}
@media (min-width:901px){.pd-nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}.pd-links{display:contents}.pd-main{grid-column:2}.pd-cvl{grid-column:3;justify-self:end}}
@media (max-width:900px){
 .pd-nav{padding:20px 16px}
 .pd-menu{display:inline-flex;align-items:center;justify-content:center}
 .pd-links{display:none;position:absolute;top:100%;left:16px;right:16px;padding:8px 20px;background:var(--surface);color:var(--text);border-radius:24px;box-shadow:0 20px 40px rgba(0,0,0,.25)}
 .pd-nav.is-open .pd-links{display:block}
 .pd-links ul{flex-direction:column;align-items:stretch;gap:0}
 .pd-links a{display:block;padding:16px 0;font-size:13px}
 .pd-main li::after{content:""!important}
 .pd-main li{display:block}
 .pd-cv{margin:0;padding:0}
 .pd-logo svg{height:32px}
}
/* home hero */
.pd-hero{position:relative;min-height:min(100svh,1100px);min-height:clamp(560px,69.2vw,1100px);display:flex;flex-direction:column;justify-content:flex-end;color:#fff;overflow:hidden;padding:0 var(--gut) clamp(32px,5vw,80px)}
.pd-hero__media{position:absolute;inset:0}
.pd-hero__poster,.pd-hero__video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pd-hero__video{opacity:0;transition:opacity .6s}.pd-hero.is-playing .pd-hero__video{opacity:1}
.pd-hero__scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,.12) 18%,rgba(0,0,0,.12) 60%,rgba(0,0,0,.55) 100%)}
.pd-hero__title{position:absolute;left:50%;top:clamp(110px,11vw,176px);transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);text-align:center;font:300 clamp(54px,11vw,175px)/.77 var(--sans);letter-spacing:-.09em;color:#fff}
.pd-hero__title em{letter-spacing:-.04em}
.pd-hero__intro{position:relative;max-width:380px;font:300 clamp(18px,1.9vw,26px)/1.05 var(--sans);letter-spacing:-.03em}
.pd-sound{position:absolute;right:var(--gut);bottom:clamp(32px,5vw,80px);min-height:44px;padding:10px 18px;border-radius:999px;border:0;background:rgba(0,0,0,.45);color:#fff;font:500 13px var(--sans);cursor:pointer;backdrop-filter:blur(8px)}
.pd-sound .pd-sound__on{display:none}.pd-sound[aria-pressed="true"] .pd-sound__on{display:inline}.pd-sound[aria-pressed="true"] .pd-sound__off{display:none}
@media (max-width:700px){.pd-hero{min-height:620px}.pd-hero__title{top:120px}.pd-sound{bottom:auto;top:96px;right:16px}}
/* footer */
.pd-footer{display:flex;flex-direction:column;align-items:flex-start;gap:40px;padding:calc(160px*var(--k)) var(--gut) 40px;background:var(--bg);color:var(--text)}
.pd-footer--short{padding-top:calc(64px*var(--k))}
.pd-eyebrow{display:block;font:700 11px/1.3 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pd-accent{color:var(--accent)}
.pd-footer__h{max-width:420px;font:300 clamp(24px,2.1vw,30px)/1.05 var(--sans);letter-spacing:-.03em}
.pd-btns{display:flex;flex-wrap:wrap;gap:12px}
.pd-footer__links{display:flex;flex-wrap:wrap;gap:24px 64px}
.pd-footer__links li{display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.5}
.pd-footer__links a:hover{color:var(--accent)}
.pd-hey{width:100%}
.pd-footer__bottom{width:100%;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;padding-top:32px;font-size:13px;color:var(--muted)}
/* theme toggle: fixed, borderless, same gap right and bottom */
.pd-theme{position:fixed;right:40px;bottom:40px;z-index:50;width:48px;height:48px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;background:var(--raised);color:var(--text);cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.pd-theme svg{width:22px;height:22px}
.pd-theme .sun{display:none}html[data-theme="light"] .pd-theme .sun{display:block}html[data-theme="light"] .pd-theme .moon{display:none}
@media (max-width:700px){.pd-theme{right:16px;bottom:16px}}
/* contact */
.pd-contact{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:32px;padding:0 var(--gut) calc(128px*var(--k))}
@media (max-width:1000px){.pd-contact{grid-template-columns:1fr}}
.pd-form{background:var(--surface);border-radius:30px;padding:clamp(24px,3vw,48px);display:flex;flex-direction:column;gap:32px}
.pd-form h2{font:300 clamp(24px,2.1vw,30px)/1.1 var(--sans);letter-spacing:-.03em}
.pd-form__head p,.pd-small{font-size:15px;line-height:1.5;color:var(--muted);margin-top:8px}
.pd-label{display:block;font:700 11px/1.3 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.pd-field{border:0;display:flex;flex-direction:column;min-width:0}
.pd-row .pd-field{flex:1 1 220px}
.pd-topics{display:flex;flex-wrap:wrap;gap:8px}
.pd-topics input{position:absolute;opacity:0;width:1px;height:1px}
.pd-topics span{display:inline-flex;align-items:center;min-height:40px;padding:10px 16px;border-radius:999px;background:var(--chip);font-size:14px;cursor:pointer}
.pd-topics input:checked+span{background:var(--text);color:var(--bg)}
.pd-topics input:focus-visible+span{outline:2px solid var(--accent);outline-offset:3px}
.pd-row{display:flex;flex-wrap:wrap;gap:16px}
.pd-form input:not([type=radio]),.pd-form textarea{width:100%;font:300 16px/1.5 var(--sans);color:var(--text);background:var(--bg);border:1px solid transparent;border-radius:16px;padding:18px 20px;resize:vertical}
.pd-form input::placeholder,.pd-form textarea::placeholder{color:var(--muted)}
.pd-form input:focus,.pd-form textarea:focus{outline:none;border-color:var(--accent)}
.pd-form [aria-invalid="true"]{border-color:#f28078!important}
.pd-actions{display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px}
.pd-note{font-size:14px;color:var(--muted)}
.pd-direct{display:flex;flex-direction:column;gap:16px}
.pd-card{background:var(--surface);border-radius:30px;padding:32px;display:flex;flex-direction:column;gap:4px}
.pd-card .pd-label{margin-bottom:8px}
.pd-big{font:300 clamp(20px,1.8vw,26px)/1.2 var(--sans);letter-spacing:-.02em;overflow-wrap:anywhere}
.pd-card .pd-btns{margin-top:16px}
/* home case rows */
.pd-site .caserow .t{transition:color .25s}
.pd-site .caserow:hover .t{color:var(--text)!important}
.pd-site .caserow[href$="iksa"]:hover .t,.pd-site .caserow[href$="iksa.html"]:hover .t{color:#5e9497!important}
/* how I work hero */
.hiw{position:relative;padding:calc(128px*var(--k)) var(--gut) calc(64px*var(--k));display:flex;flex-direction:column;gap:24px}
.hiw__h{font:300 clamp(44px,6.04vw,96px)/1.1 var(--sans);letter-spacing:-.04em;max-width:1000px}
.hiw__sel{position:relative;display:inline-block;border:1.5px solid var(--text);padding:0 .12em;margin:0 .05em;line-height:1}
.hiw__sel em{font-size:1.17em}
.hiw__h1,.hiw__h2,.hiw__sel::before,.hiw__sel::after{content:"";position:absolute;width:9px;height:9px;background:var(--bg);border:1.5px solid var(--text)}
.hiw__sel::before{left:-5px;top:-5px}.hiw__sel::after{right:-5px;top:-5px}.hiw__h1{left:-5px;bottom:-5px}.hiw__h2{right:-5px;bottom:-5px}
.hiw__size{position:absolute;left:50%;top:calc(100% + 10px);transform:translateX(-50%);background:var(--text);color:var(--bg);font:400 11px/1 'JetBrains Mono',monospace;padding:4px 6px;border-radius:4px;letter-spacing:0;white-space:nowrap}
.hiw__cur{position:absolute;right:-28px;bottom:-34px;display:flex;flex-direction:column;align-items:flex-start;color:var(--text);letter-spacing:0}
.hiw__cur span{background:var(--text);color:var(--bg);font:400 12px/1 var(--sans);padding:4px 8px;border-radius:999px;margin-left:10px}
.hiw__sticker{display:inline-flex;align-items:center;gap:6px;vertical-align:middle;border:1px solid var(--text);border-radius:999px;padding:6px 12px;font:400 13px/1 var(--sans);letter-spacing:0;transform:rotate(-4deg);margin-left:.3em;white-space:nowrap}
.hiw__lede{max-width:880px;font:300 clamp(17px,1.38vw,22px)/1.35 var(--sans);letter-spacing:-.02em;color:var(--muted);margin-top:16px}
.hiw__pin{position:absolute;right:var(--gut);top:calc(128px*var(--k) + 20px);display:flex;gap:12px;align-items:flex-start}
.hiw__avatar{width:36px;height:36px;border-radius:50% 50% 50% 4px;background:var(--text);color:var(--bg);display:grid;place-items:center;font:400 14px var(--sans)}
.hiw__bubble{background:var(--surface);border-radius:16px;padding:14px 18px;font-size:13px}
.hiw__bubble span{color:var(--muted);font-size:12px}
.hiw__say{font-size:16px;margin-top:6px}
@media (max-width:1100px){.hiw__pin{position:static;order:-1;align-self:flex-end}}
@media (max-width:700px){.hiw__size{display:none}.hiw__sticker{margin:12px 0 0;display:flex;width:max-content}.hiw__cur{display:none}.hiw__pin{display:none}}
/* image grids */
.pd-site .igrid>*{width:100%!important;max-width:none!important;min-width:0!important}
/* notes TOC */
.pd-site .toc-on .t{color:var(--accent)!important;font-weight:400!important}
@media (prefers-reduced-motion:reduce){.pd-site *{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
.pd-site [id]{scroll-margin-top:24px}
@media (max-width:700px){.pd-site .sec>.f{row-gap:24px}}

.pd-site .toc__list{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.pd-site .tocit{display:block;padding:8px 0;font:300 15px/1.5 var(--sans);color:var(--muted)}
.pd-site .tocit:hover{color:var(--text)}
.pd-site .tocit.toc-on{color:var(--accent);font-weight:400}
.pd-site .tocit.toc-on::before{content:"→  ";white-space:pre}
</style>
